name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-quality:
    name: Ubuntu quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}-python-3.12.12
          cache-python: false
          prune-cache: true
      - name: Synchronize locked environment
        run: uv sync --locked --python 3.12.12 --managed-python
      - name: Verify lock file
        run: uv lock --check
      - name: Run non-Docker test suite
        run: uv run pytest -m "not postgres_integration"
      - name: Run Ruff
        run: uv run ruff check .
      - name: Check Ruff formatting
        run: uv run ruff format --check .
      - name: Run Pyright
        run: uv run pyright
      - name: Check conflict markers
        run: uv run python scripts/check_conflict_markers.py
      - name: Test conflict-marker checker
        run: uv run pytest tests/test_conflict_markers.py

  postgres-integration:
    name: PostgreSQL and pgvector integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}-python-3.12.12
          cache-python: false
          prune-cache: true
      - name: Synchronize locked environment
        run: uv sync --locked --python 3.12.12 --managed-python
      - name: Run isolated PostgreSQL integration
        run: uv run python scripts/run_postgres_integration.py

  windows-native:
    name: Windows native compatibility
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}-python-3.12.12
          cache-python: false
          prune-cache: true
      - name: Synchronize locked environment
        run: uv sync --locked --python 3.12.12 --managed-python
      - name: Verify Windows Torch CPU build
        run: uv run python -c "import torch; assert torch.__version__.split('+')[0] == '2.12.0'; assert torch.tensor([1.0], device='cpu').item() == 1.0"
      - name: Import Torch
        run: uv run python -c "import torch"
      - name: Import CTranslate2
        run: uv run python -c "import ctranslate2"
      - name: Import Faster-Whisper
        run: uv run python -c "import faster_whisper"
      - name: Import SentenceTransformers
        run: uv run python -c "import sentence_transformers"
      - name: Import SetFit
        run: uv run python -c "import setfit"
      - name: Run focused native and lazy tests
        run: >-
          uv run pytest
          tests/test_lazy_faster_whisper_imports.py
          tests/test_faster_whisper_engine.py
          tests/test_transcribe_cli.py
          tests/test_transcribe_streaming_file.py
          tests/test_diarization_offline_evaluation.py
