# Synthetic local integration credentials only. Never use this service in production.
services:
  postgres-vector-integration:
    image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: "no"
    environment:
      POSTGRES_DB: callmetric_vector_test
      POSTGRES_USER: callmetric_test
      POSTGRES_PASSWORD: callmetric_test_password
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U callmetric_test -d callmetric_vector_test
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 5s
    volumes:
      - postgres-integration-data:/var/lib/postgresql/data

volumes:
  postgres-integration-data:
