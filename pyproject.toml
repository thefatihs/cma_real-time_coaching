[project]
name = "callmetric-live-asr"
version = "0.1.0"
description = "Low-latency streaming speech recognition service for real-time call center coaching."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiortc==1.15.0",
    "av==17.1.0",
    "fastapi>=0.139.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1,<0.29",
    "jiwer>=4.0.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.3.4,<4",
    "pydantic-settings>=2.14.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0,<6",
    "setfit>=1.1.3",
    "streamlit>=1.60.0",
    "streamlit-webrtc==0.76.2",
    "torch==2.12.0; sys_platform == 'win32'",
    "transformers<5",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
markers = [
    "postgres_integration: requires the opt-in Docker PostgreSQL integration runner",
]
