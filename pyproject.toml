[project]
name = "callmetric-live-asr"
version = "0.1.0"
description = "Low-latency streaming speech recognition service for real-time call center coaching."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.1",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
